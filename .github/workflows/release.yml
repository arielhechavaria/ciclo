name: Release

# Push a tag like v0.1.0 to publish a signed APK as a GitHub pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode signing key
        env:
          CICLO_KEYSTORE_BASE64: ${{ secrets.CICLO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CICLO_KEYSTORE_BASE64" ]; then
            echo "::error::Missing CICLO_KEYSTORE_BASE64 secret. Run scripts/setup-release-signing.sh once."
            exit 1
          fi
          echo "$CICLO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ciclo-release.p12"

      - name: Test and build signed APK
        timeout-minutes: 15
        env:
          CICLO_KEYSTORE_PATH: ${{ runner.temp }}/ciclo-release.p12
          CICLO_KEYSTORE_PASSWORD: ${{ secrets.CICLO_KEYSTORE_PASSWORD }}
          CICLO_KEY_ALIAS: ${{ secrets.CICLO_KEY_ALIAS }}
          CICLO_VERSION_CODE: ${{ github.run_number }}
        run: |
          export CICLO_VERSION_NAME="${GITHUB_REF_NAME#v}"
          gradle :domain:test :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug --no-daemon

      - name: Verify APK signature and manifest
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$bt/aapt2" dump badging app/build/outputs/apk/release/app-release.apk | head -5

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="ciclo-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp app/build/outputs/apk/debug/app-debug.apk "ciclo-${GITHUB_REF_NAME}-debug.apk"
          gh release create "$GITHUB_REF_NAME" "$apk" "ciclo-${GITHUB_REF_NAME}-debug.apk" \
            --title "Ciclo $GITHUB_REF_NAME" --generate-notes --prerelease
