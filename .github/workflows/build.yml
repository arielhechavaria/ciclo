name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests
        timeout-minutes: 10
        run: gradle :domain:test :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      # The app is fully offline: fail if any library brought a network permission into the APK.
      - name: Check the APK requests no network permission
        run: |
          aapt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          permissions=$("$aapt" dump permissions app/build/outputs/apk/debug/*.apk)
          echo "$permissions"
          if echo "$permissions" | grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE)"; then
            echo "::error::The APK requests network access"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: ciclo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
