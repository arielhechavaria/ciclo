name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests
        timeout-minutes: 10
        run: gradle :domain:test :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: app/build/screenshots/**
          if-no-files-found: warn

      - name: List UI screenshots
        if: always()
        run: |
          {
            echo "### UI screenshots (artifact \`ui-screenshots\`)"
            if ls app/build/screenshots/*.png >/dev/null 2>&1; then
              for f in app/build/screenshots/*.png; do echo "- $(basename "$f")"; done
            else
              echo "_No screenshots were produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ciclo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
